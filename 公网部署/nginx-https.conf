server {
    listen 80 default_server;
    server_name 43.129.169.13;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 43.129.169.13;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/43.129.169.13/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.129.169.13/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        auth_basic "HerbLab demo";
        auth_basic_user_file /etc/nginx/.htpasswd-herblab;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 110s;
        client_max_body_size 64k;
    }
}
